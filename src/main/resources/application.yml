micronaut:
  application:
    name: nquiz-ai-service
  messages:
    basename: i18n/messages
  server:
    port: 8080
    shutdown: grace
    max-request-size: 1MB
    default-charset: UTF-8
    response:
      default-charset: UTF-8
  data:
    jdbc:
      enable-sql-logging: false
      dialect: H2
      operations:
        enable-read-only: false
  router:
    static-resources:
      default:
        enabled: true
        mapping: "/**"
        paths: "classpath:public"

jackson:
  default-charset: UTF-8

netty:
  default-charset: UTF-8

llm:
  groq:
    url: https://api.groq.com/openai/v1/chat/completions
    model: llama-3.1-70b-versatile
    access-id: ${GROQ_ACCESS_ID:}
    api-key: ${GROQ_API_KEY:}
  openai:
    url: https://api.openai.com/v1/chat/completions
    model: gpt-4o-mini
    access-id: ${OPENAI_ACCESS_ID:}
    api-key: ${OPENAI_API_KEY:}
  deepseek:
    # DeepSeek V4.1 Flash is now available on the DeepSeek API with native multimodal support. 
    # Change the model name to deepseek-flash to call the latest V4.1 Flash model
    url: https://api.deepseek.com/chat/completions
    model: deepseek-flash
    access-id: ${DEEPSEEK_ACCESS_ID:}
    api-key: ${DEEPSEEK_API_KEY:}
  gemini:
    url: https://generativelanguage.googleapis.com/v1beta/models/gemini-flash-latest:generateContent
    model: gemini-2.5-flash
    access-id: ${GEMINI_ACCESS_ID:}
    api-key: ${GEMINI_API_KEY:}

datasources:
  default:
    url: jdbc:sqlite:/data/nquiz-ai-service.db
    driverClassName: org.sqlite.JDBC
    username: ""
    password: ""
    readOnly: false
    options:
      autoCommit: true
      readOnly: false
    hikari:
      readOnly: false
      isReadOnly: false
    connectionProperties:
      journal_mode: WAL
      synchronous: NORMAL

flyway:
  datasources:
    default:
      enabled: true

payment:
  webhook-secret: ${PAYMENT_WEBHOOK_SECRET:}

kind: Application
