<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NQuiz AI Service</title>
    <script src="https://cdn.jsdelivr.net/npm/js-yaml@4.1.0/dist/js-yaml.min.js"></script>
    <!-- FAV icons -->
    <link rel="icon" type="image/png" href="/ico/favicon-96x96.png" sizes="96x96" />
    <link rel="icon" type="image/svg+xml" href="/ico/favicon.svg" />
    <link rel="shortcut icon" href="/ico/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/ico/apple-touch-icon.png" />
    <link rel="manifest" href="/ico/site.webmanifest" />
    <!-- -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow: hidden;
        }

        .container {
            text-align: center;
            padding: 2rem;
            position: relative;
            z-index: 1;
        }

        /* Animated background */
        .bg-blob {
            position: absolute;
            width: 400px;
            height: 400px;
            background: linear-gradient(#3b82f6, #8b5cf6);
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.15;
            animation: float 8s ease-in-out infinite;
            z-index: -1;
        }

        @keyframes float {
            0%, 100% { transform: translate(-50px, -50px) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.2); }
        }

        h1 {
            font-size: 3.5rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        h2 {
            font-size: 2.0rem;
            font-weight: 800;
            background: linear-gradient(to right, #60a5fa, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 1rem;
        }

        p {
            font-size: 1.2rem;
            color: #94a3b8;
            max-width: 600px;
            margin: 0 auto 2rem auto;
            line-height: 1.6;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            background-color: #1e293b;
            padding: 0.75rem 1.5rem;
            border-radius: 9999px;
            border: 1px solid #334155;
            font-weight: 600;
            color: #4ade80;
            box-shadow: 0 0 15px rgba(74, 222, 128, 0.1);
        }

        .pulse {
            width: 10px;
            height: 10px;
            background-color: #4ade80;
            border-radius: 50%;
            box-shadow: 0 0 10px #4ade80;
            animation: pulse-animation 2s infinite;
        }

        @keyframes pulse-animation {
            0% { opacity: 1; transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { opacity: 1; transform: scale(0.95); box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        .badge {
            background-color: #1e293b;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .link {
            background-color: #1e293b;
            padding: 0.5rem 1rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            color: #cbd5e1;
            border: 1px solid #334155;
        }

        .lang-switcher {
            position: fixed;
            top: 1.5rem;
            right: 1.5rem;
            display: flex;
            gap: 0.5rem;
            z-index: 2;
        }

        .lang-btn {
            background-color: #1e293b;
            color: #cbd5e1;
            border: 1px solid #334155;
            padding: 0.4rem 0.9rem;
            border-radius: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            cursor: pointer;
            font-family: 'Inter', sans-serif;
        }

        .lang-btn:hover {
            border-color: #60a5fa;
        }

        .lang-btn.active {
            background-color: #3b82f6;
            border-color: #3b82f6;
            color: #ffffff;
        }
    </style>
</head>
<body>
<div class="lang-switcher">
    <button class="lang-btn" data-lang="ru">RU</button>
    <button class="lang-btn" data-lang="en">EN</button>
    <button class="lang-btn" data-lang="it">IT</button>
</div>
<div class="bg-blob"></div>
<div class="container">
    <h1>NQuiz AI</h1>
    <p data-i18n="tagline">A high-performance microservice for processing and generating quizzes powered by artificial intelligence.</p>

    <div class="status-badge">
        <div class="pulse"></div>
        <span data-i18n="status">Operational</span>
    </div>

    <div>
        <h2><a href="https://lainlab.com/?lang=en" style="text-decoration: none;">Lain S.r.l.</a></h2>
    </div>
</div>
<script>
    const I18N = {
        en: {
            title: "NQuiz AI Service",
            tagline: "A high-performance microservice for processing and generating quizzes powered by artificial intelligence.",
            status: "Operational"
        },
        ru: {
            title: "NQuiz AI Service",
            tagline: "Высокопроизводительный микросервис для обработки и генерации викторин на основе искусственного интеллекта.",
            status: "Работает"
        },
        it: {
            title: "NQuiz AI Service",
            tagline: "Microservizio ad alte prestazioni per elaborare e generare quiz basati sull'intelligenza artificiale.",
            status: "Operativo"
        }
    };

    const SUPPORTED = ["ru", "en", "it"];

    function detectLang() {
        const fromUrl = new URLSearchParams(window.location.search).get("lang");
        if (fromUrl && SUPPORTED.includes(fromUrl)) return fromUrl;
        const stored = localStorage.getItem("lang");
        if (stored && SUPPORTED.includes(stored)) return stored;
        const langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (const tag of langs) {
            const base = (tag || "en").toLowerCase().split("-")[0];
            if (SUPPORTED.includes(base)) return base;
        }
        return "en";
    }

    function setLang(lang) {
        const dict = I18N[lang];
        document.documentElement.lang = lang;
        document.title = dict.title;
        document.querySelectorAll("[data-i18n]").forEach(function (el) {
            el.textContent = dict[el.dataset.i18n];
        });
        document.querySelectorAll(".lang-btn").forEach(function (btn) {
            btn.classList.toggle("active", btn.dataset.lang === lang);
        });
        localStorage.setItem("lang", lang);
        const url = new URL(window.location);
        url.searchParams.set("lang", lang);
        window.history.replaceState({}, "", url);
    }

    const current = detectLang();
    document.querySelectorAll(".lang-btn").forEach(function (btn) {
        btn.addEventListener("click", function () {
            setLang(btn.dataset.lang);
        });
    });
    setLang(current);
</script>
</body>
</html>
